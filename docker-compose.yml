services:
  puente:
    build: .
    container_name: puente
    restart: unless-stopped
    ports:
      # Solo localhost: el túnel CF (en Hermes) apunta a 127.0.0.1:8091. No se expone en la LAN.
      - "127.0.0.1:8091:8000"
    volumes:
      - ./data:/data
    environment:
      - DROP_DATA_DIR=/data
      - DROP_RETENTION_DAYS=7
      - DROP_MAX_MB=2048
      - TZ=America/Montevideo
    # DROP_TOKEN va acá, fuera del repo.
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
